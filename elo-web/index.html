<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}/* Elo · tokens (versão clara do app; o protótipo assume o visual claro do produto) */
:root {
  --azul-50:#EEF4FF; --azul-100:#DCE8FF; --azul-200:#B5CEFF; --azul-300:#7FB0FF; --azul-500:#2F6FED; --azul-600:#1F5BD6; --azul-700:#1847A8; --azul-900:#0E2A66;
  --verm-50:#FFF0EF; --verm-500:#E5484D; --verm-700:#B4232A; --amar-50:#FFF8DB; --amar-400:#F7C531; --amar-800:#7A5A00;
  --verde-50:#EAF8EF; --verde-500:#2FA36B; --verde-700:#1D7348; --roxo-50:#F3EEFF; --roxo-700:#5B3CC4;
  --n0:#FFFFFF; --n50:#F6F8FB; --n100:#EDF0F5; --n200:#DDE2EA; --n400:#9AA3B2; --n600:#5A6475; --n800:#2B3343; --n900:#161C28;
  --fundo:var(--n50); --sup:var(--n0); --texto:var(--n900); --texto2:var(--n600); --borda:var(--n200); --prim:var(--azul-600); --link:var(--azul-700);
  --f-tit:'Nunito', 'Trebuchet MS', system-ui, sans-serif; --f-txt:'Atkinson Hyperlegible', 'Verdana', system-ui, sans-serif;
  --r-card:16px; --r-folha:28px; --r-pill:8px; --r-campo:12px;
  color-scheme: light;
}
body { background: var(--fundo); color: var(--texto); font-family: var(--f-txt); font-size: 16px; line-height: 1.5; }
*, *::before, *::after { box-sizing: border-box; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--azul-500); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3, h4 { font-family: var(--f-tit); margin: 0; line-height: 1.25; text-wrap: balance; }
p { margin: 0; }
.ic { flex: none; display: block; }
.logo { display: inline-flex; align-items: center; gap: 10px; }
.logo img { display: block; width: auto; }
.logo b { font-family: var(--f-tit); font-weight: 800; color: var(--azul-900); letter-spacing: -.01em; line-height: 1; }
.muted { color: var(--texto2); }
.small { font-size: 14px; line-height: 20px; }
.cap { font-size: 12px; line-height: 16px; font-weight: 700; }
.row { display: flex; align-items: center; gap: 12px; }
.col { display: flex; flex-direction: column; gap: 12px; }
.grow { flex: 1; min-width: 0; }
.card { background: var(--sup); border: 1px solid var(--borda); border-radius: var(--r-card); padding: 16px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 22px; border-radius: var(--r-card); font-family: var(--f-tit); font-weight: 700; font-size: 16px; transition: background .15s, box-shadow .15s; }
.btn.full { width: 100%; }
.btn.sm { min-height: 44px; padding: 0 16px; font-size: 15px; }
.b-prim { background: var(--prim); color: #fff; } .b-prim:hover { background: var(--azul-700); }
.b-sec { background: var(--azul-50); color: var(--link); } .b-sec:hover { background: var(--azul-100); }
.b-fant { color: var(--link); } .b-fant:hover { background: var(--azul-50); }
.b-cinza { background: var(--n100); color: var(--n800); } .b-cinza:hover { background: var(--n200); }
.b-perigo { background: var(--verm-50); color: var(--verm-700); } .b-perigo:hover { box-shadow: inset 0 0 0 2px var(--verm-700); }
.btn[disabled] { background: var(--n100); color: var(--n600); cursor: default; }
.pill { display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 10px; border-radius: var(--r-pill); font-size: 14px; font-weight: 700; white-space: nowrap; }
.p-feito, .p-ativo, .p-atingido, .p-psico { background: var(--verde-50); color: var(--verde-700); }
.p-agora { background: var(--prim); color: #fff; }
.p-depois, .p-saiu { background: var(--n100); color: var(--n600); }
.p-fono, .p-perigo { background: var(--verm-50); color: var(--verm-700); }
.p-to, .p-licenca { background: var(--amar-50); color: var(--amar-800); }
.p-aba, .p-neutra { background: var(--azul-50); color: var(--link); }

// ===== Exportação (arquivos gerados no aparelho) =====
function baixarArquivo(nome, mime, texto) {
  const blob = new Blob([texto], { type: mime + ';charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nome;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
const csvLinha = (cols) => cols.map(c => '"' + String(c ?? '').replace(/"/g, '""') + '"').join(';');
function abrirRelatorio(titulo, subtitulo, secoes) {
  const css = 'body{font-family:Arial,Helvetica,sans-serif;color:#161C28;max-width:820px;margin:32px auto;padding:0 20px;line-height:1.45}h1{font-size:24px;margin:0}h2{font-size:17px;margin:28px 0 8px;border-bottom:2px solid #DDE2EA;padding-bottom:6px}.sub{color:#5A6475;margin:4px 0 16px}.aviso{background:#FFF8DB;border-radius:8px;padding:10px 14px;font-size:13px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid #DDE2EA;vertical-align:top}th{background:#F6F8FB}button{font:inherit;font-weight:700;background:#1F5BD6;color:#fff;border:0;border-radius:10px;padding:10px 18px;cursor:pointer}@media print{button{display:none}}';
  const esc2 = (x) => String(x ?? '').replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  const corpo = secoes.map(([t, cab, linhas]) => `<h2>${esc2(t)}</h2>` + (linhas.length ? `<table><tr>${cab.map(c => `<th>${esc2(c)}</th>`).join('')}</tr>${linhas.map(l => `<tr>${l.map(c => `<td>${esc2(c)}</td>`).join('')}</tr>`).join('')}</table>` : '<p>Nada neste período.</p>')).join('');
  const html = `<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>${esc2(titulo)}</title><style>${css}</style></head><body><p><button onclick="print()">Imprimir ou salvar em PDF</button></p><h1>${esc2(titulo)}</h1><p class="sub">${esc2(subtitulo)}</p><p class="aviso">Este documento contém dados de saúde, protegidos pela LGPD. Guarde em local seguro e compartilhe só com quem precisa.</p>${corpo}<p class="sub" style="margin-top:28px">Gerado pelo Elo (protótipo, dados fictícios).</p></body></html>`;
  const url = URL.createObjectURL(new Blob([html], { type: 'text/html;charset=utf-8' }));
  const w = window.open(url, '_blank'); if (!w) baixarArquivo(titulo.replace(/\s+/g, '-').toLowerCase() + '.html', 'text/html', html);
}

// ===== Apresentação inicial =====
function intro(slides, onDone) {
  let i = 0;
  const el = document.createElement('div');
  el.className = 'intro'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-label', 'Apresentação do Elo');
  el.innerHTML = `<div class="intro-bg"><i></i><i></i><i></i><i></i></div><div class="intro-card"><button class="intro-skip" data-i="skip">Pular</button><div class="intro-body"></div></div>`;
  const body = el.querySelector('.intro-body'), skip = el.querySelector('.intro-skip');
  const draw = (dir) => {
    const s = slides[i], last = i === slides.length - 1;
    skip.hidden = last;
    body.innerHTML = `<div class="intro-slide ${dir || ''}">
        <div class="intro-art">${s.art}</div>
        <p class="intro-eyebrow">${s.eyebrow}</p>
        <h2>${s.title}</h2>
        <p class="intro-text">${s.text}</p>
      </div>
      <div class="intro-foot">
        <div class="intro-dots">${slides.map((_, k) => `<button data-i="${k}" aria-label="Ir para o passo ${k + 1}" ${k === i ? 'aria-current="step"' : ''}></button>`).join('')}</div>
        <div class="row" style="gap:8px">${i > 0 ? `<button class="btn sm b-fant" data-i="prev">Voltar</button>` : ''}<button class="btn sm b-prim" data-i="next">${last ? 'Começar' : 'Próximo'}${ic(last ? 'check' : 'direita', 18)}</button></div>
      </div>`;
    const nb = body.querySelector('[data-i="next"]'); if (nb) nb.focus({ preventScroll: true });
